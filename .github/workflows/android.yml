name: Build Android APK

# Produces an installable APK as a downloadable artifact.
#
# The build runs here rather than in the dev environment because assembling an
# APK needs the Android SDK from dl.google.com, which the sandboxed environment's
# network policy denies. GitHub's runners ship the SDK preinstalled, so this is
# the shortest path from a commit to something you can sideload.

on:
  push:
    branches: ['**']
    paths:
      - 'apps/prototype/**'
      - 'packages/edit-engine/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 17, not 21: Capacitor 6 pins Gradle 8.2.1, and Gradle only gained
          # JDK 21 support in 8.5. Building on 21 fails at configuration time.
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Run engine tests
        # The APK is only worth building if the editing core is sound, so the
        # suite gates the build rather than running beside it.
        run: npm test

      - name: Build web assets
        run: npm run build --workspace @apex/prototype

      - name: Sync Capacitor
        working-directory: apps/prototype
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: apps/prototype/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK by commit
        id: name
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          SRC=apps/prototype/android/app/build/outputs/apk/debug/app-debug.apk
          DEST="apexedit-${SHORT_SHA}.apk"
          cp "$SRC" "$DEST"
          echo "apk=$DEST" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apexedit-apk
          path: ${{ steps.name.outputs.apk }}
          if-no-files-found: error
          retention-days: 30
