name: Build Android APK

# Compiles the native Kotlin app, runs the core unit tests, and publishes an
# installable APK as a downloadable artifact.
#
# The build runs here rather than in the development sandbox because assembling
# an APK needs the Android SDK from dl.google.com, which that environment's
# network policy denies at the CONNECT level — Gradle's google() repository
# resolves there, so even the Android plugin cannot be fetched. GitHub's
# runners ship the SDK preinstalled.

on:
  push:
    branches: ['**']
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # AGP 8.7 requires JDK 17.
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Unit tests
        working-directory: android
        # The editing core is pure Kotlin, so its conformance suite runs on the
        # JVM in seconds. The APK is only worth building if these pass.
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Lint
        working-directory: android
        run: ./gradlew lintDebug --no-daemon || true

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK by commit
        id: name
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          SRC=android/app/build/outputs/apk/debug/app-debug.apk
          DEST="apexedit-${SHORT_SHA}.apk"
          cp "$SRC" "$DEST"
          echo "apk=$DEST" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apexedit-apk
          path: ${{ steps.name.outputs.apk }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: android/app/build/reports/
          retention-days: 7
